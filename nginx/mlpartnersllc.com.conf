# Rate limit for the contact form endpoint (per client IP)
limit_req_zone $binary_remote_addr zone=contact_form:1m rate=3r/m;

# HTTP - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mlpartnersllc.com www.mlpartnersllc.com;

    # Allow Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/lib/letsencrypt;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://mlpartnersllc.com$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mlpartnersllc.com www.mlpartnersllc.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/mlpartnersllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlpartnersllc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to non-www
    if ($host = www.mlpartnersllc.com) {
        return 301 https://mlpartnersllc.com$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve static files from Astro build
    root /mnt/ssd/github/mlpartnersllc.com/dist;
    index index.html;

    # FM Prep study tools (single source of truth: /usr/share/nginx/fmprep-html)
    # Redirect /fmprep -> /fmprep/ so the alias + relative paths resolve.
    location = /fmprep {
        return 301 https://mlpartnersllc.com/fmprep/;
    }

    # ^~ so the static-asset regex location below cannot override the alias.
    location ^~ /fmprep/ {
        alias /usr/share/nginx/fmprep-html/;
        index index.html;
        try_files $uri $uri/ /fmprep/index.html;

        # The interactive study tools compile JSX in-browser via @babel/standalone,
        # which needs 'unsafe-eval'. An add_header inside a location DROPS inherited
        # server headers, so re-declare them here with an eval-permitting CSP. This is
        # intentional (user approved): these auth-walled tool pages need eval to render,
        # and the old fmprep.marianadv.com served them with no CSP at all.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # Same basic auth as fmprep.marianadv.com
        auth_basic "FM Prep";
        auth_basic_user_file /etc/nginx/fmprep.htpasswd;

        # The app uses absolute (root) paths; rewrite them to the /fmprep/ prefix.
        sub_filter_once off;
        sub_filter 'href="/tools/'        'href="/fmprep/tools/';
        sub_filter "'/tools-index.json'"  "'/fmprep/tools-index.json'";
        sub_filter 'href="/"'             'href="/fmprep/"';

        # Block access to the source directory
        location ^~ /fmprep/src/ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ---- FM Prep 2 (interactive study hub + Lua JSON API + FMPrepTutor bridge) ----
    # Vanilla JS (no JSX/eval), so it inherits the server CSP. Same basic auth as /fmprep.
    location = /fmprep2 {
        return 301 https://mlpartnersllc.com/fmprep2/;
    }

    location ^~ /fmprep2/api/ {
        auth_basic off;
        default_type application/json;
        content_by_lua_file /usr/local/openresty/nginx/conf/conf.d/fmprep2_api.lua;
    }

    location ^~ /fmprep2/ {
        alias /usr/share/nginx/fmprep2-html/;
        index index.html;
        try_files $uri $uri/ /fmprep2/index.html;
        auth_basic off;
    }

    # Contact form API -> local SES relay (repo: server/contact_api.py, port 8826)
    location = /api/contact {
        limit_req zone=contact_form burst=5 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8826;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Encrypted upload endpoint (page: /localupload2.html) -> shared Node upload
    # server on :8082 (repo: mlpartnership.com/upload-server.js). Browser encrypts
    # with age before upload; server stores ciphertext only, token-gated.
    location = /upload-encrypted-raw {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:8082/upload-encrypted-raw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Filename $http_x_filename;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Logging
    access_log /var/log/nginx/mlpartnersllc.com.access.log;
    error_log /var/log/nginx/mlpartnersllc.com.error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
