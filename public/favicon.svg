<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Subtle neural node accents -->
  <circle cx="18" cy="18" r="4" fill="url(#accent)"/>
  <circle cx="82" cy="82" r="5" fill="url(#accent)"/>
  <circle cx="80" cy="20" r="3" fill="url(#accent)"/>
  <line x1="18" y1="18" x2="50" y2="50" stroke="rgba(165,180,252,0.15)" stroke-width="1.5"/>
  <line x1="82" y1="82" x2="50" y2="50" stroke="rgba(165,180,252,0.15)" stroke-width="1.5"/>
  <line x1="80" y1="20" x2="50" y2="50" stroke="rgba(165,180,252,0.12)" stroke-width="1"/>
  <!-- ML Text -->
  <text x="50" y="66" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="600" fill="white" text-anchor="middle" letter-spacing="-1">ML</text>
</svg>
